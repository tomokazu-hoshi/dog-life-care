languageCode = 'ja-jp'
title = 'ワンライフ・ナビ'
theme = 'ananke'
hasCJKLanguage = true

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  # ヘッダーの背景色設定
  background_color_class = "bg-gold"
  read_more_copy = "詳しく見る"
  description = "愛犬との暮らしを豊かにする、犬種別の性格・飼い方・健康管理の総合ガイド。"

[markup]
