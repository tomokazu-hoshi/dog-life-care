<nav class="f7 gray pv3" aria-label="Breadcrumb">
  <a href="{{ "/" | relURL }}" class="no-underline gray hover-black">HOME</a>
  <span class="ph2">＞</span>
  
  {{ if eq .Section "posts" }}
    <a href="{{ "/posts/" | relURL }}" class="no-underline gray hover-black">犬種図鑑</a>
    {{ if .Params.categories }}
      <span class="ph2">＞</span>
      {{ range .Params.categories }}
        <a href="{{ (printf "/categories/%s/" .) | relURL }}" class="no-underline gray hover-black">{{ . }}</a>
      {{ end }}
    {{ end }}
  {{ end }}

  {{ if .IsPage }}
    <span class="ph2">＞</span>
    <span class="black fw6">{{ .Title }}</span>
  {{ end }}
</nav>
