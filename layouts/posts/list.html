{{ define "main" }}
<div style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <nav style="font-size: 0.8rem; color: #999; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}" style="color:#999; text-decoration:none;">HOME</a> ＞ 犬種図鑑
  </nav>

  <h2 style="border-left: 5px solid #dfbb00; padding-left: 10px; font-size: 1.4rem;">犬種図鑑 検索</h2>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
    {{ range $name, $taxonomy := .Site.Taxonomies.categories }}
    <a href="{{ "categories/" | relURL }}{{ $name | urlize }}/" style="text-decoration:none; background:#fff; border:2px solid #dfbb00; color:#333; padding:20px 10px; border-radius:10px; text-align:center; font-weight:bold;">
      {{ $name }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
