{{ define "main" }}
<style>
  .search-container { padding: 25px; max-width: 800px; margin: 0 auto; }
  .breadcrumb { font-size: 0.85rem; color: #a1a1aa; margin-bottom: 30px; }
  .breadcrumb a { color: #d97706; text-decoration: none; font-weight: 600; }
  .section-title { font-size: 1.6rem; color: #1f2937; border-left: 6px solid #fbbf24; padding-left: 15px; margin-bottom: 35px; }
  
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .cat-btn { 
    text-decoration: none; background: #fff; border: 2px solid #fde68a; color: #4b5563; 
    padding: 25px 10px; border-radius: 20px; text-align: center; font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.2s;
  }
  .cat-btn:active { background: #fbbf24; color: #fff; }
</style>

<div class="search-container">
  <nav class="breadcrumb"><a href="{{ "" | relURL }}">HOME</a> ＞ 犬種図鑑</nav>
  <h2 class="section-title">犬種図鑑 検索</h2>

  <div class="cat-grid">
    {{ range $name, $taxonomy := .Site.Taxonomies.categories }}
    <a href="{{ "categories/" | relURL }}{{ $name | urlize }}/" class="cat-btn">{{ $name }}</a>
    {{ end }}
  </div>
</div>
{{ end }}
