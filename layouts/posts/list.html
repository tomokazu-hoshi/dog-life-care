{{ define "main" }}
<div class="home-header" style="padding: 20px; background-color: #e0e0e0; text-align: center; border-bottom: 1px solid #ccc;">
  <h2 style="margin:0; font-size: 1.4rem;">犬種図鑑 検索</h2>
</div>

<div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
  <nav style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}" style="color: #888;">HOME</a> ＞ 犬種図鑑
  </nav>

  <div class="category-grid" style="display: flex; flex-wrap: wrap; gap: 10px;">
    {{ range $name, $items := .Site.Taxonomies.categories }}
    <a href="{{ "categories/" | relURL }}{{ $name | urlize }}/" style="background-color: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; width: calc(50% - 15px); text-align: center; text-decoration: none; color: #333; font-weight: bold; font-size: 0.9rem;">
      {{ $name }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
