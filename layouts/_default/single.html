{{ define "main" }}
<article style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <nav style="font-size: 0.8rem; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}">HOME</a> ＞ <a href="{{ "posts/" | relURL }}">犬種図鑑</a> ＞ {{ .Title }}
  </nav>

  <h1 style="font-size: 2rem;">{{ .Title }}</h1>

  <div style="background: #f9f9f9; border: 2px solid #dfbb00; border-radius: 10px; padding: 15px; margin-bottom: 30px;">
    <h2 style="font-size: 1rem; margin-top: 0; text-align: center;">📊 クイックチェック表</h2>
    <table style="width: 100%; border-collapse: collapse;">
      <tr style="border-bottom: 1px solid #ddd;"><td style="padding:10px; font-weight:bold;">寿命</td><td style="text-align:right;">記事内参照</td></tr>
      <tr style="border-bottom: 1px solid #ddd;"><td style="padding:10px; font-weight:bold;">抜け毛</td><td style="text-align:right;">記事内参照</td></tr>
    </table>
  </div>

  <div style="line-height: 1.8;">{{ .Content }}</div>

  <section style="margin-top: 50px; padding: 20px; background: #fff9e6; border: 2px dashed #dfbb00; border-radius: 10px;">
    <h3 style="font-size: 1rem; margin-top: 0;">🛍️ {{ .Title }} おすすめアイテム</h3>
    <p style="font-size: 0.8rem; color: #888; text-align: center;">[ 商品リンクをここに設置 ]</p>
  </section>
</article>
{{ end }}
