{{ define "main" }}
<div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px; background-color: #fff; min-height: 100vh;">
  <nav style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}" style="color: #888;">HOME</a> ＞ <a href="{{ "posts/" | relURL }}" style="color: #888;">犬種図鑑</a> ＞ 
    {{ with .Params.categories }}{{ range . }}{{ . }}{{ end }}{{ end }} ＞ {{ .Title }}
  </nav>

  <h1 style="font-size: 1.8rem; border-bottom: 2px solid #dfbb00; padding-bottom: 10px; margin-bottom: 25px;">{{ .Title }}</h1>

  <div style="background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin-bottom: 30px;">
    <h2 style="font-size: 1rem; margin-top: 0; text-align: center; color: #dfbb00;">📊 クイックチェック表</h2>
    <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
      <tr style="border-bottom: 1px solid #eee;"><td style="padding: 10px; font-weight: bold;">寿命</td><td style="text-align: right;">12〜15年</td></tr>
      <tr style="border-bottom: 1px solid #eee;"><td style="padding: 10px; font-weight: bold;">抜け毛</td><td style="text-align: right;">少ない</td></tr>
      <tr><td style="padding: 10px; font-weight: bold;">しつけ</td><td style="text-align: right;">初心者向き</td></tr>
    </table>
  </div>

  <div style="line-height: 1.8;">
    {{ .Content }}
  </div>

  <div style="margin-top: 50px; padding: 20px; background-color: #fdfdfd; border: 1px dashed #dfbb00; border-radius: 10px; text-align: center;">
    <p style="font-size: 0.8rem; color: #888;">[ 商品リンクエリア ]</p>
  </div>
</div>
{{ end }}
