{{ define "main" }}
<style>
  .article-wrap { padding: 20px; max-width: 800px; margin: 0 auto; color: #333; line-height: 1.9; }
  .article-header h1 { font-size: 1.8rem; color: #1f2937; margin-bottom: 20px; border-bottom: 3px solid #fbbf24; padding-bottom: 10px; }
  
  /* 📊 クイックチェック表の再現 */
  .quick-card { background: #fff; border: 2px solid #fbbf24; border-radius: 20px; padding: 20px; margin-bottom: 40px; box-shadow: 0 10px 25px rgba(251,191,36,0.15); }
  .quick-card h2 { text-align: center; font-size: 1.1rem; color: #d97706; margin-top: 0; }
  .q-table { width: 100%; border-collapse: collapse; }
  .q-table tr { border-bottom: 1px solid #fff7ed; }
  .q-table td { padding: 12px 5px; font-size: 0.95rem; }
  .q-table td.b { font-weight: bold; color: #92400e; width: 45%; }
  
  /* 本文中の見出し */
  .article-body h2 { border-left: 6px solid #fbbf24; padding-left: 15px; margin: 40px 0 20px; color: #1f2937; font-size: 1.3rem; }
  
  /* アフィリエイト枠 */
  .ad-box { background: #fffbeb; border: 2px dashed #fbbf24; border-radius: 20px; padding: 25px; margin-top: 50px; text-align: center; }
</style>

<article class="article-wrap">
  <nav class="breadcrumb"><a href="{{ "" | relURL }}">HOME</a> ＞ <a href="{{ "posts/" | relURL }}">犬種図鑑</a> ＞ {{ .Title }}</nav>

  <header class="article-header">
    <h1>{{ .Title }}</h1>
  </header>

  <div class="quick-card">
    <h2>📊 クイックチェック表</h2>
    <table class="q-table">
      <tr><td class="b">しつけ難易度</td><td>記事内参照</td></tr>
      <tr><td class="b">抜け毛の多さ</td><td>記事内参照</td></tr>
      <tr><td class="b">運動量</td><td>1日2回 1時間〜</td></tr>
      <tr><td class="b">寿命</td><td>12〜15年</td></tr>
    </table>
  </div>

  <div class="article-body">
    {{ .Content }}
  </div>

  <div class="ad-box">
    <h3 style="color:#d97706; font-size:1.1rem; margin-top:0;">🛍️ {{ .Title }} おすすめアイテム</h3>
    <p style="font-size:0.85rem; color:#b45309;">愛犬に最適なグッズをセレクト中</p>
  </div>
</article>
{{ end }}
