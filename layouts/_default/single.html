{{ define "main" }}
<article style="padding: 20px; max-width: 800px; margin: 0 auto; line-height: 1.8;">
  <nav style="font-size: 0.8rem; color: #999; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}" style="color:#999; text-decoration:none;">HOME</a> ＞ 
    <a href="{{ "posts/" | relURL }}" style="color:#999; text-decoration:none;">犬種図鑑</a> ＞ 
    {{ with .Params.categories }}{{ range . }}<span>{{ . }}</span> ＞ {{ end }}{{ end }}
    <span style="font-weight: bold; color: #333;">{{ .Title }}</span>
  </nav>

  <h1 style="font-size: 1.8rem; margin: 0 0 20px 0;">{{ .Title }}</h1>

  <div style="background: #fdfdfd; border: 2px solid #dfbb00; border-radius: 12px; padding: 15px; margin-bottom: 30px;">
    <h2 style="font-size: 1rem; margin: 0 0 10px 0; text-align: center;">📊 クイックチェック表</h2>
    <table style="width: 100%; font-size: 0.9rem; border-collapse: collapse;">
      <tr style="border-bottom: 1px solid #eee;"><td style="padding: 8px; font-weight: bold;">しつけ難易度</td><td style="padding: 8px; text-align: right;">記事内参照</td></tr>
      <tr style="border-bottom: 1px solid #eee;"><td style="padding: 8px; font-weight: bold;">抜け毛の多さ</td><td style="padding: 8px; text-align: right;">記事内参照</td></tr>
      <tr><td style="padding: 8px; font-weight: bold;">寿命</td><td style="padding: 8px; text-align: right;">記事内参照</td></tr>
    </table>
  </div>

  <div class="article-content">
    {{ .Content }}
  </div>

  <section style="margin-top: 50px; padding: 20px; background: #fff9e6; border: 2px dashed #dfbb00; border-radius: 15px; text-align: center;">
    <h2 style="font-size: 1.1rem; margin-top: 0;">🛍️ {{ .Title }} におすすめの厳選アイテム</h2>
    <p style="color: #888; font-size: 0.9rem;">[ おすすめアイテムの広告をここに配置 ]</p>
  </section>

  <nav style="margin-top: 40px; text-align: center;">
    <a href="{{ "posts/" | relURL }}" style="color: #dfbb00; font-weight: bold; text-decoration: none;">他の犬種を探す →</a>
  </nav>
</article>
{{ end }}
