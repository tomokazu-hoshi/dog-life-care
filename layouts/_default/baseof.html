<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | ワンライフナビ</title>
  <style>
    body { background-color: #fcfcf9; color: #333; font-family: sans-serif; margin: 0; padding: 0; }
    /* 共通ヘッダー：黒文字1つだけ */
    .common-header { padding: 40px 20px; text-align: center; background: #fff; border-bottom: 1px solid #eee; }
    .common-header a { text-decoration: none; color: #000; }
    .common-header h1 { margin: 0; font-size: 2rem; font-weight: bold; letter-spacing: 2px; }
  </style>
</head>
<body>
  <header class="common-header">
    <a href="{{ "" | relURL }}"><h1>ワンライフナビ</h1></a>
  </header>
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
