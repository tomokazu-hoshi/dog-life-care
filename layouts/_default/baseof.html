<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ワンライフナビ</title>
  <style>
    :root { --gold: #dfbb00; }
    body { background-color: #fcfcf9; color: #333; font-family: sans-serif; margin: 0; }
    /* 黒文字の共通ヘッダー（これ1つだけにします） */
    header { padding: 40px 20px; text-align: center; background: #fff; }
    header h1 { color: #000; margin: 0; font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; }
    header a { text-decoration: none; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>
  <header><a href="{{ "" | relURL }}"><h1>ワンライフナビ</h1></a></header>
  <main class="container">{{ block "main" . }}{{ end }}</main>
  <footer style="text-align: center; padding: 40px; color: #bbb; font-size: 0.8rem;">&copy; ワンライフ・ナビ 2026</footer>
</body>
</html>
