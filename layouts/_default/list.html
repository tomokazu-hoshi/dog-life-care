　{{ define "main" }}
<div style="max-width: 800px; margin: 0 auto; padding: 20px;">
  
  <h2 style="text-align: center; font-size: 1.2rem; margin-bottom: 30px;">{{ .Title }}</h2>

  <div style="display: flex; flex-direction: column; gap: 15px;">
    {{ range .Pages.ByTitle }}
    <a href="{{ .RelPermalink }}" style="display: block; background: #fff; border: 1.5px solid #dfbb00; border-radius: 20px; padding: 22px; text-decoration: none; color: #333; font-weight: bold; text-align: center; box-shadow: 0 4px 12px rgba(223,187,0,0.1);">
      {{ .Title }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
