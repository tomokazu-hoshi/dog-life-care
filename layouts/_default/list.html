{{ define "main" }}
<h2 style="text-align: center; font-size: 1.2rem; color: #333; margin-bottom: 30px; letter-spacing: 1px;">{{ .Title }} 一覧</h2>

<div style="display: flex; flex-direction: column; gap: 15px;">
  {{ range .Pages.ByTitle }}
  <a href="{{ .RelPermalink }}" class="breed-card">
    {{ .Title }}
  </a>
  {{ end }}
</div>

<style>
  .breed-card {
    display: block; background: #fff; border: 1.5px solid var(--gold);
    border-radius: 20px; padding: 22px; text-decoration: none; color: #444;
    font-weight: bold; font-size: 1.05rem; text-align: center;
    box-shadow: 0 6px 15px rgba(223, 187, 0, 0.08); transition: 0.2s;
  }
  .breed-card:active { background: #fff9e6; transform: translateY(2px); }
</style>
{{ end }}
