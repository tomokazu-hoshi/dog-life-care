{{ define "main" }}
<div style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <nav style="font-size: 0.8rem; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}">HOME</a> ＞ <a href="{{ "posts/" | relURL }}">犬種図鑑</a> ＞ {{ .Title }}
  </nav>

  <h2 style="border-left: 5px solid #dfbb00; padding-left: 10px;">{{ .Title }} 一覧</h2>

  <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" style="background:#dfbb00; color:#fff; padding:15px 25px; border-radius:10px; text-decoration:none; font-weight:bold;">
      {{ .Title }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
