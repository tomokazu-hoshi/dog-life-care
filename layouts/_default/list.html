{{ define "main" }}
<div class="category-header" style="background-color: #e0e0e0; padding: 20px; text-align: center; border-bottom: 1px solid #ccc;">
  <h2 style="margin:0; font-size: 1.4rem;">{{ .Title }} 一覧</h2>
</div>

<div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
  <nav style="font-size: 0.8rem; color: #888; margin-bottom: 20px;">
    <a href="{{ "" | relURL }}" style="color: #888;">HOME</a> ＞ <a href="{{ "posts/" | relURL }}" style="color: #888;">犬種図鑑</a> ＞ {{ .Title }}
  </nav>

  <div class="category-grid" style="display: flex; flex-wrap: wrap; gap: 10px;">
    {{ range .Pages.ByTitle }}
    <a href="{{ .RelPermalink }}" style="background-color: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; width: calc(50% - 15px); text-align: center; text-decoration: none; color: #333; font-weight: bold; font-size: 0.9rem;">
      {{ .Title }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
