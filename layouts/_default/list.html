{{ define "main" }}
<style>
  .list-container { padding: 25px; max-width: 800px; margin: 0 auto; }
  .breed-tags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .breed-tag { 
    text-decoration: none; background: #fff; border: 1.5px solid #e5e7eb; color: #374151; 
    padding: 15px 25px; border-radius: 40px; font-weight: bold; font-size: 1rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
</style>

<div class="list-container">
  <nav class="breadcrumb"><a href="{{ "" | relURL }}">HOME</a> ＞ <a href="{{ "posts/" | relURL }}">犬種図鑑</a> ＞ {{ .Title }}</nav>
  <h2 class="section-title">{{ .Title }} 一覧</h2>

  <div class="breed-tags">
    {{ range .Pages.ByTitle }}
    <a href="{{ .RelPermalink }}" class="breed-tag">{{ .Title }}</a>
    {{ end }}
  </div>
</div>
{{ end }}
