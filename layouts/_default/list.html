{{ define "main" }}
<div style="padding: 15px; max-width: 800px; margin: 0 auto;">
  <nav style="font-size: 0.8rem; color: #888; margin-bottom: 15px;"><a href="{{ "" | relURL }}" style="color:#888;">HOME</a> ＞ 犬種図鑑</nav>
  <h2 style="font-size: 1.3rem; border-left: 5px solid #dfbb00; padding-left: 10px; margin-bottom: 20px;">犬種図鑑 検索</h2>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    {{ range $name, $items := .Site.Taxonomies.categories }}
    <a href="{{ "categories/" | relURL }}{{ $name | urlize }}/" style="text-decoration:none; background:#fff; border:2px solid #dfbb00; color:#333; padding:18px 5px; border-radius:10px; text-align:center; font-weight:bold; font-size:0.9rem;">
      {{ $name }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
