{{ define "main" }}
<div style="padding: 15px; max-width: 800px; margin: 0 auto;">
  <nav style="font-size: 0.8rem; color: #888; margin-bottom: 15px;">
    <a href="{{ "" | relURL }}" style="color:#888;">HOME</a> ＞ <a href="{{ "posts/" | relURL }}" style="color:#888;">犬種図鑑</a> ＞ {{ .Title }}
  </nav>

  <h2 style="font-size: 1.3rem; border-left: 5px solid #dfbb00; padding-left: 10px; margin-bottom: 20px;">{{ .Title }} 一覧</h2>

  <div style="display: flex; flex-wrap: wrap; gap: 10px;">
    {{ range .Pages.ByTitle }}
    <a href="{{ .RelPermalink }}" style="background:#dfbb00; color:#fff; padding:12px 18px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:0.9rem; flex-grow: 1; text-align: center;">
      {{ .Title }}
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
