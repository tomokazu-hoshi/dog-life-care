<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お悩み相談室 | ワンライフ・ナビ</title>
    <style>
        body { font-family: sans-serif; line-height: 1.8; max-width: 600px; margin: auto; padding: 20px; background: #f9f9f9; }
        .form-card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #f39c12; color: #fff; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <header><a href="index.html" style="text-decoration:none;color:#f39c12;">← 戻る</a></header>
    <h1>🐾 お悩み相談室</h1>
    <div class="form-card">
        <p>愛犬のしつけ、健康、元野犬特有の悩みなど、何でもお寄せください。星 友和が直接拝見いたします。</p>
        <form action="https://formspree.io/f/mqakeven" method="POST">
            <label>お名前<input type="text" name="name" required></label>
            <label>メールアドレス<input type="email" name="email" required></label>
            <label>相談内容<textarea name="message" rows="5" required></textarea></label>
            <button type="submit">相談を送信する</button>
        </form>
    </div>
</body>
</html>
