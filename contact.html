<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛犬のお悩み相談室 | ワンライフ・ナビ</title>
    <meta name="description" content="愛犬のしつけ、健康、食事など、飼い主さんのリアルな悩みをお聞かせください。専門家や経験者がアドバイスのヒントを提案します。">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #f39c12;
            --secondary-color: #2c3e50;
            --bg-color: #f9f9f9;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            color: #333;
            background-color: var(--bg-color);
        }

        header {
            background: #fff;
            padding: 1rem;
            border-bottom: 2px solid var(--primary-color);
        }

        header a { text-decoration: none; color: var(--primary-color); font-weight: bold; }

        .container { max-width: 700px; margin: 2rem auto; padding: 0 1.5rem; }

        .form-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 { font-size: 1.8rem; color: var(--secondary-color); text-align: center; margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; color: var(--secondary-color); }
        
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea { height: 150px; resize: vertical; }

        .btn-submit {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover { background: #e67e22; }

        .info-box {
            background: #fff9e6;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary-color);
        }

        footer { text-align: center; padding: 3rem; color: #888; }
    </style>
</head>
<body>

<header>
    <a href="index.html"><i class="fas fa-chevron-left"></i> ホームへ戻る</a>
</header>

<div class="container">
    <div class="form-card">
        <h1>🐾 愛犬のお悩み相談室</h1>
        
        <div class="info-box">
            ご投稿いただいた内容は、サイト内の記事で回答させていただく場合がございます。
            ※緊急を要する健康状態については、すぐにかかりつけの動物病院へご相談ください。
        </div>

        <form action="https://formspree.io/f/sample" method="POST">
            <div class="form-group">
                <label>お名前（ニックネーム可）</label>
                <input type="text" name="name" placeholder="例：ハチのパパ" required>
            </div>

            <div class="form-group">
                <label>返信用メールアドレス</label>
                <input type="email" name="_replyto" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label>お悩みのカテゴリー</label>
                <select name="category">
                    <option value="しつけ">しつけ・行動</option>
                    <option value="健康・食事">健康・食事</option>
                    <option value="お出かけ">お出かけ・旅行</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <div class="form-group">
                <label>愛犬の種類・年齢</label>
                <input type="text" name="dog_info" placeholder="例：トイプードル 3歳">
            </div>

            <div class="form-group">
                <label>相談内容（できるだけ詳しく）</label>
                <textarea name="message" placeholder="例：散歩中に他の犬を見ると吠えてしまい困っています…" required></textarea>
            </div>

            <button type="submit" class="btn-submit">この内容で相談する</button>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 ワンライフ・ナビ</p>
</footer>

</body>
</html>
