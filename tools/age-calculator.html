<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛犬の人間年齢換算シミュレーター | ワンライフ・ナビ</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CV6GN80DZ2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CV6GN80DZ2');
    </script>
    <style>
        body { font-family: sans-serif; line-height: 1.8; max-width: 600px; margin: auto; padding: 20px; background: #f0f8ff; text-align: center; }
        .calc-card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        button { background: #f39c12; color: #fff; border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <header><a href="../index.html" style="text-decoration:none;color:#f39c12;font-weight:bold;">← HOME</a></header>
    <h1>🐶 年齢シミュレーター</h1>
    <div class="calc-card">
        <select id="size"><option value="small">小型・中型犬</option><option value="large">大型犬</option></select>
        <input type="number" id="age" placeholder="年齢を入力">
        <button onclick="calculate()">計算する</button>
        <div id="result"></div>
    </div>
    <script>
        function calculate() {
            const age = parseInt(document.getElementById('age').value);
            const size = document.getElementById('size').value;
            let res = age === 1 ? 15 : (age === 2 ? 24 : (size === 'small' ? 24 + (age-2)*4 : 24 + (age-2)*7));
            document.getElementById('result').innerText = `人間なら約 ${res} 歳です！`;
        }
    </script>
</body>
</html>
