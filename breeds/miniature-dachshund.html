    <style> :root { --primary: #8d6e63; } body { font-family: sans-serif; line-height: 1.8; padding: 20px; max-width: 800px; margin: auto; background: #efebe9; } h1 { border-bottom: 3px solid var(--primary); color: var(--primary); } .box { background: #fff; padding: 20px; border-radius: 10px; } </style>

<body>
    <h1>ミニチュアダックス：胴長短足の愛すべき猟犬</h1>
    <div class="box">
        <h2>ヘルニアを防ぐ3つの習慣</h2>
        <p><strong>1. 体重管理：</strong> 100gの増量が腰への大きな負担に。肋骨にうっすら触れる太さを維持しましょう。</p>
        <p><strong>2. 段差の解消：</strong> 階段や段差は極力スロープを設置。抱っこは必ず「横抱き」で。</p>
        <p><strong>3. 背筋を鍛える：</strong> 適切な散歩で腰周りの筋肉を維持することが最大の予防です。</p>
    </div>
