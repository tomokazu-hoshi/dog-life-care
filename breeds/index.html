<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>犬種別のお悩み解決ガイド | ワンライフ・ナビ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #f39c12; --secondary-color: #2c3e50; --bg-color: #f9f9f9; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; padding: 0; background: var(--bg-color); line-height: 1.6; }
        header { background: #fff; padding: 1rem; border-bottom: 2px solid var(--primary-color); }
        header a { text-decoration: none; color: var(--primary-color); font-weight: bold; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
        h1 { text-align: center; color: var(--secondary-color); margin-bottom: 2rem; }
        .breed-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
        .breed-card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-decoration: none; color: inherit; transition: transform 0.3s; border: 1px solid #eee; }
        .breed-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .breed-img { height: 120px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #ccc; }
        .breed-info { padding: 1.2rem; }
        .breed-info h3 { margin: 0 0 0.5rem; color: var(--secondary-color); font-size: 1.1rem; }
        .breed-tag { font-size: 0.7rem; background: #fdf2e9; color: var(--primary-color); padding: 0.2rem 0.5rem; border-radius: 5px; }
        footer { text-align: center; padding: 3rem; color: #888; }
    </style>
</head>
<body>
<header><div class="container" style="margin:0 auto;"><a href="../index.html"><i class="fas fa-chevron-left"></i> ホームへ戻る</a></div></header>
<div class="container">
    <h1>🐾 犬種別のお悩み解決ガイド</h1>
    <p style="text-align: center; margin-bottom: 3rem;">あなたの愛犬に合わせた、専門的なケア方法を見つけましょう。</p>
    
    <div class="breed-grid">
        <a href="toy-poodle.html" class="breed-card">
            <div class="breed-img" style="background-color: #fdf2e9;"><i class="fas fa-dog" style="color: #d35400;"></i></div>
            <div class="breed-info">
                <span class="breed-tag">人気 No.1</span>
                <h3>トイプードル</h3>
            </div>
        </a>

        <a href="chihuahua.html" class="breed-card">
            <div class="breed-img" style="background-color: #fff5f5;"><i class="fas fa-dog" style="color: #e74c3c;"></i></div>
            <div class="breed-info">
                <span class="breed-tag">超小型犬</span>
                <h3>チワワ</h3>
            </div>
        </a>

        <a href="shiba-inu.html" class="breed-card">
            <div class="breed-img" style="background-color: #f5eef8;"><i class="fas fa-dog" style="color: #8e44ad;"></i></div>
            <div class="breed-info">
                <span class="breed-tag">日本犬</span>
                <h3>柴犬</h3>
            </div>
        </a>

        <a href="golden-retriever.html" class="breed-card">
            <div class="breed-img" style="background-color: #ebf5fb;"><i class="fas fa-dog" style="color: #2980b9;"></i></div>
            <div class="breed-info">
                <span class="breed-tag">大型犬</span>
                <h3>ゴールデン</h3>
            </div>
        </a>
    </div>
</div>
<footer><p>&copy; 2026 ワンライフ・ナビ</p></footer>
</body>
</html>
