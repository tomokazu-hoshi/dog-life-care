    <style> :root { --primary: #e91e63; } body { font-family: sans-serif; line-height: 1.8; padding: 20px; max-width: 800px; margin: auto; background: #fff5f7; } h1 { border-bottom: 3px solid var(--primary); color: var(--primary); } .box { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); } </style>

<body>
    <h1>チワワ：世界最小の勇敢なパートナー</h1>
    <div class="box">
        <h2>注意すべき健康ポイント</h2>
        <p><strong>1. 膝蓋骨脱臼（パテラ）：</strong> ソファからの飛び降りは厳禁。滑り止めのマットを敷きましょう。</p>
        <p><strong>2. 歯周病：</strong> お口が小さく汚れが溜まりやすいため、毎日の歯磨きが寿命を左右します。</p>
        <p><strong>3. 低血糖：</strong> 特に子犬期は食事の間隔が空きすぎないよう注意が必要です。</p>
    </div>
