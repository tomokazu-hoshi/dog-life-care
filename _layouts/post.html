<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | 犬種図鑑</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tag { background: #eee; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ page.title }}</h1>
        <p>日付: {{ page.date | date: "%Y-%m-%d" }} | カテゴリ: {{ page.categories | join: " > " }}</p>
        <div class="tags">
            {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
        </div>
        <hr>
        {{ content }}
        <hr>
        <a href="/">← 図鑑トップへ戻る</a>
    </div>
</body>
</html>
