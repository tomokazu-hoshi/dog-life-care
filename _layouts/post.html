---
layout: default
---
{% include breadcrumb.html %}

<article class="pa3 bg-white br3 shadow-4 mb4">
  <h1 class="f2 fw9 mb3">{{ page.title }}</h1>
  <div class="lh-copy f5 black-80">
    {{ content }}
  </div>
</article>

<div class="tc pv3">
  {% if page.category %}
    <a href="{{ '/categories/' | append: page.category | append: '/' | relative_url }}" class="f6 link dim br2 ph3 pv2 mb2 dib white bg-black">一覧に戻る</a>
  {% else %}
    <a href="{{ '/' | relative_url }}" class="f6 link dim br2 ph3 pv2 mb2 dib white bg-black">ホームに戻る</a>
  {% endif %}
</div>
