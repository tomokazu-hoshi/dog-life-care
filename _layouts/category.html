---
layout: default
---
<div style="padding: 20px;">
  <h1 style="text-align: center; color: #333;">{{ page.title }} 一覧</h1>
  
  {% assign posts = site.categories[page.category_name] %}
  
  <div style="margin-top: 20px;">
    {% for post in posts %}
      <a href="{{ post.url | relative_url }}" style="display: block; background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 10px; text-decoration: none; color: #333; border: 1px solid #eee; font-weight: bold;">
        {{ post.title }}
      </a>
    {% else %}
      <p style="text-align: center; color: #999;">現在、準備中です。</p>
    {% endfor %}
  </div>

  <div style="text-align: center; margin-top: 30px;">
    <a href="{{ '/dog-search/' | relative_url }}" style="color: #888; text-decoration: none;">← 犬種図鑑に戻る</a>
  </div>
</div>
