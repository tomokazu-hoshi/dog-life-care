---
layout: default
---
{% include breadcrumb.html %}

<header class="tc pv3">
  <h1 class="f3 fw9 black">{{ page.title }} 一覧</h1>
</header>

<div class="ph2">
  <div class="flex flex-wrap">
    {% for post in site.categories[page.category_name] %}
    <div class="w-100 mb2">
      <a href="{{ post.url | relative_url }}" class="db ba br2 b--black-10 pa3 bg-white shadow-4 no-underline black hover-bg-gold flex items-center justify-between">
        <span class="fw6">{{ post.title }}</span>
        <span class="gray f7">＞</span>
      </a>
    </div>
    {% endfor %}
  </div>
</div>

<div class="tc pv4">
  <a href="{{ '/posts/' | relative_url }}" class="f7 link dim gray">← 検索ページに戻る</a>
</div>
