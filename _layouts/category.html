---
layout: default
---
{% include breadcrumb.html %}

<style>
.category-header { text-align: center; padding: 30px 10px; background: #f8f9fa; border-radius: 15px; margin-bottom: 20px; }
.category-header h1 { margin: 0; font-size: 1.5rem; color: #333; }
.post-list { list-style: none; padding: 0; }
.post-item { background: #fff; margin-bottom: 12px; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; text-decoration: none; border: 1px solid #eee; }
.post-title { color: #333; font-weight: bold; font-size: 1rem; }
.arrow { color: #ccc; }
.back-nav { text-align: center; padding: 30px 0; }
.btn-back { color: #888; text-decoration: none; font-size: 0.9rem; }
</style>

<div class="category-header">
  <h1>{{ page.title }} 一覧</h1>
</div>

<div style="padding: 0 10px;">
  {% assign posts = site.categories[page.category_name] | sort: "title" %}
  
  <div class="post-list">
    {% for post in posts %}
    <a href="{{ post.url | relative_url }}" class="post-item">
      <span class="post-title">{{ post.title }}</span>
      <span class="arrow">＞</span>
    </a>
    {% else %}
    <div style="text-align: center; padding: 50px 0; color: #999;">
      <p>「{{ page.category_name }}」の記事は準備中です。</p>
    </div>
    {% endfor %}
  </div>
</div>

<div class="back-nav">
  <a href="{{ '/dog-search/' | relative_url }}" class="btn-back">← 犬種図鑑に戻る</a>
</div>
