<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | ワンライフ・ナビ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #f39c12; --secondary-color: #2c3e50; --bg-color: #f9f9f9; }
        body { font-family: sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background: var(--bg-color); }
        header { background: #fff; padding: 1rem; text-align: center; border-bottom: 3px solid var(--primary-color); }
        header a { text-decoration: none; color: var(--primary-color); font-weight: bold; font-size: 1.5rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        footer { text-align: center; padding: 3rem; background: var(--secondary-color); color: #fff; margin-top: 5rem; }
    </style>
</head>
<body>

<header>
    <a href="{{ site.baseurl }}/">🐾 ワンライフ・ナビ</a>
</header>

<div class="container">
    {{ content }}
</div>

<footer>
    <p>&copy; 2026 ワンライフ・ナビ</p>
</footer>

</body>
</html>
