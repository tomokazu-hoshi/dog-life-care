---
layout: default
---
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPhoneで作る犬種図鑑</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .main-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #1c1e21; }
        ul { list-style: none; padding: 0; }
        li { margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        a { text-decoration: none; color: #007bff; font-weight: bold; font-size: 1.1em; }
        .desc { font-size: 0.9em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>🐶 犬種図鑑</h1>
        <p style="text-align:center;">最新の記事一覧</p>
        <ul>
            {% for post in site.posts %}
            <li>
                <a href="{{ post.url }}">{{ post.title }}</a>
                <div class="desc">{{ post.description }}</div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
