<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ワンライフナビ</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; color: #1d1d1f; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 30px; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .menu-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #007aff;
        }
        .menu-box .icon { font-size: 30px; margin-right: 15px; }
        .menu-box .text { font-size: 18px; }
        .menu-box:active { transform: scale(0.98); background: #f0f7ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ワンライフナビ</h1>
        <div class="menu-grid">
            <a href="{{ '/dog-breeds.html' | relative_url }}" class="menu-box">
                <span class="icon">📖</span>
                <span class="text">犬種図鑑（カテゴリー検索）</span>
            </a>
        </div>
    </div>
</body>
</html>
