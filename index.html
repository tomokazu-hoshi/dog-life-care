<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワンライフ・ナビ | 愛犬の悩み解決と健康を守る総合ガイド</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #f39c12; --secondary-color: #2c3e50; --bg-color: #f9f9f9; --text-color: #333; }
        body { font-family: sans-serif; margin: 0; padding: 0; line-height: 1.6; color: var(--text-color); background-color: var(--bg-color); }
        header { background: #fff; padding: 1rem; text-align: center; border-bottom: 3px solid var(--primary-color); }
        .hero { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('{{ site.baseurl }}/IMG_0645.png'); background-size: cover; padding: 7rem 1rem; text-align: center; color: #fff; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .card { background: #fff; padding: 1.5rem 0.5rem; border-radius: 15px; text-align: center; text-decoration: none; color: var(--secondary-color); border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .card i { font-size: 2rem; color: var(--primary-color); margin-bottom: 0.7rem; }
        .section-title { text-align: center; margin: 3rem 0 1.5rem; }
        .zukan-cta { background: #fff; border: 2px solid var(--primary-color); border-radius: 20px; padding: 2.5rem 1.5rem; text-align: center; text-decoration: none; color: var(--secondary-color); display: block; transition: 0.3s; }
        .cta-button-ui { display: inline-block; background: var(--primary-color); color: #fff; padding: 12px 40px; border-radius: 50px; font-weight: bold; margin-top: 15px; }
    </style>
</head>

</section>

<div class="container">

    <a href="{{ site.baseurl }}/index-zukan.html" class="zukan-cta">
