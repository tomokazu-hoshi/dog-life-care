<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #f39c12; --secondary-color: #2c3e50; --bg-color: #fffcf5; --text-main: #333; }

        .syuon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; background: #fff; padding: 15px; border-radius: 10px; }
        .syuon-item { text-align: center; padding: 10px 0; border: 1px solid #eee; text-decoration: none; color: #555; font-weight: bold; }

</head>
