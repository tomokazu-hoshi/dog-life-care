<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ワンライフナビ | トップ</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1d1d1f; margin-bottom: 30px; font-size: 24px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .box { 
            background: #fff; border: 2px solid #007aff; border-radius: 15px; 
            aspect-ratio: 1 / 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-decoration: none; 
            color: #333; font-weight: bold; transition: 0.2s;
        }
        .box:active { transform: scale(0.95); background: #f0f7ff; }
        .icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ワンライフナビ</h1>
        <div class="grid">
            <a href="/dog-breeds.html" class="box">
                <span class="icon">📖</span>
                <span>犬種図鑑</span>
            </a>
            <div class="box" style="border-color:#ccc; color:#999;">
                <span class="icon">🏠</span>
                <span>しつけ</span>
            </div>
            <div class="box" style="border-color:#ccc; color:#999;">
                <span class="icon">🏥</span>
                <span>健康</span>
            </div>
            <div class="box" style="border-color:#ccc; color:#999;">
                <span class="icon">🛒</span>
                <span>グッズ</span>
            </div>
        </div>
    </div>
</body>
</html>
