<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #f39c12; --secondary-color: #2c3e50; --bg-color: #fffcf5; }
        body { font-family: sans-serif; line-height: 1.8; max-width: 900px; margin: auto; padding: 20px; background: var(--bg-color); }
        .breadcrumb { font-size: 0.8rem; margin-bottom: 20px; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .tag { background: #fff; border: 1px solid var(--primary-color); padding: 8px 15px; border-radius: 20px; text-decoration: none; color: var(--primary-color); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; text-decoration: none; color: inherit; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid var(--primary-color); }
        h1, h2 { color: var(--secondary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; }
    </style>
</head>
