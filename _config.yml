# サイト設定
title: "ワンライフナビ"
description: "iPhoneで作る犬種図鑑"
url: "https://tomokazu-hoshi.github.io"
baseurl: "/dog-life-care"

# 記事URLの設定（日付を含まないシンプルな形に変更）
permalink: /:title/

# 未来の日付の記事も表示する
future: true
timezone: Asia/Tokyo

# ビルド設定
markdown: kramdown
highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/
