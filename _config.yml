# ---------------------------------------------------------
# ワンライフ・ナビ 公式設定ファイル (_config.yml)
# ---------------------------------------------------------

url: "https://tomokazu-hoshi.github.io"
baseurl: "/dog-life-care"

title: "ワンライフ・ナビ"
description: "愛犬の悩み解決と健康を守る総合ガイド"

# 花のサイト（咲くナビ）と同じURL構造に設定
permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge

# Google通知用プラグイン
plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
