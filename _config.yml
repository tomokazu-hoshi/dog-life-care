# サイトの基本設定
title: "犬種図鑑"
description: "iPhoneで作成中の犬種サイト"
remote_theme: pages-themes/primer@v0.2.0

# ビルド設定（処理を安定させます）
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
incremental: false

# 除外設定（不要なファイルを読み込まないようにしてエラーを防ぐ）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md

# プラグイン
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 記事のデフォルト設定
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
