# ---------------------------------------------------------
# ワンライフ・ナビ 設定ファイル (_config.yml)
# ---------------------------------------------------------

url: "https://tomokazu-hoshi.github.io"
baseurl: "/dog-life-care"

title: "ワンライフ・ナビ"
description: "愛犬の悩み解決と健康を守る総合ガイド"

# 花のサイトと同じシンプルなURL構造
permalink: /:categories/:title.html

# 拡張機能
plugins:
  - jekyll-sitemap

# 除外設定
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
