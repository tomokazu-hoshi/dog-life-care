# サイトの基本設定
title: "犬種図鑑"
description: "犬種の特徴をまとめた図鑑サイトです"
remote_theme: pages-themes/primer@v0.2.0

# ビルド設定
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
incremental: false

# 記事のURL設定
permalink: /posts/:title/

# 除外設定（ビルドを軽くし、エラーを防ぐために必須）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md

# プラグイン（GitHub Pages標準）
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 記事のデフォルト設定
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
