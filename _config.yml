# サイト基本情報
title: "犬種図鑑（仮）"
description: "世界中の犬種を詳しく解説するサイトです"

# テーマ設定（remote_themeではなく、標準のtheme指定に戻します）
theme: jekyll-theme-primer

# ビルド設定
encoding: "utf-8"
markdown: kramdown
highlighter: rouge

# プラグイン設定（GitHub Pagesが標準サポートしているものに絞ります）
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist

# 読み込み除外設定（不要なファイルを読み込まないようにします）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
