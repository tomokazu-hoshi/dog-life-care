# サイトの基本設定
title: "犬種図鑑"
description: "iPhoneで作成中の犬種サイト"
# バージョン指定を外して最新版を使うように修正しました
remote_theme: pages-themes/primer

# ビルド設定
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
incremental: false

# 除外設定
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md

# プラグイン
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 記事のデフォルト設定
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
