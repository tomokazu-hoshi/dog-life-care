# サイト設定
title: "iPhoneで作る犬種図鑑"
description: "Jekyllで運営する新しい犬種図鑑サイト"
url: "https://your-username.github.io" # ご自身のURLに書き換えてください

# 記事のURL形式（シンプルに設定）
permalink: /:title.html

# 未来の日付の記事も表示する
future: true
timezone: Asia/Tokyo

# ビルド設定
markdown: kramdown
highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/
