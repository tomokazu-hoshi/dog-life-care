baseURL = 'https://tomokazu-hoshi.github.io/dog-life-care/'
languageCode = 'ja-jp'
title = 'ワンライフナビ'
theme = 'ananke'
hasCJKLanguage = true

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  # ヘッダーの色を「ピンク（pink）」に変更して可愛らしく
  background_color_class = "bg-pink"
  read_more_copy = "詳しく見る"
  description = "愛犬との暮らしを豊かにする、犬種別の性格・飼い方・健康管理の総合ガイド。"

# Markdown内でHTMLを許可する設定
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
