<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検索結果｜ワンライフ・ナビ</title>
</head>
<body>
    <h1 id="tag-name">検索中...</h1>
    <ul id="dog-list"></ul>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tag = params.get('tag');
        document.getElementById('tag-name').innerText = tag + " の一覧";

        // Jekyllが生成した記事データを取得（簡易版）
        const posts = [
            {% for post in site.posts %}
            {
                "title": "{{ post.title }}",
                "url": "{{ site.baseurl }}{{ post.url }}",
                "tags": {{ post.category_tags | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {% endfor %}
        ];

        const list = document.getElementById('dog-list');
        const filtered = posts.filter(p => p.tags.includes(tag));
        
        filtered.forEach(p => {
            list.innerHTML += `<li><a href="${p.url}">${p.title}</a></li>`;
        });
    </script>
</body>
</html>
