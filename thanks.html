<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 | ワンライフ・ナビ</title>
    <meta name="description" content="お悩み相談の送信が完了しました。愛犬との暮らしをサポートする情報を引き続きお楽しみください。">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #f39c12;
            --secondary-color: #2c3e50;
            --bg-color: #f9f9f9;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
            background-color: var(--bg-color);
        }

        header {
            background: #fff;
            padding: 1rem;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }

        header h1 { margin: 0; font-size: 1.2rem; color: var(--primary-color); }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .thanks-card {
            background: #fff;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .thanks-card i {
            font-size: 4rem;
            color: #27ae60;
            margin-bottom: 1.5rem;
        }

        .thanks-card h2 {
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .thanks-card p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            padding: 1rem 2.5rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: transform 0.3s, background 0.3s;
        }

        .btn-home:hover {
            background: #e67e22;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: var(--secondary-color);
            color: #fff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>ワンライフ・ナビ</h1>
</header>

<div class="content">
    <div class="thanks-card">
        <i class="fas fa-check-circle"></i>
        <h2>送信が完了しました！</h2>
        <p>大切なお悩みを受け付けました。<br>
        いただいた内容は、サイト運営の参考にさせていただきます。<br>
        ※回答は記事の更新をもって代えさせていただく場合がございます。</p>
        
        <a href="index.html" class="btn-home">ホームに戻る</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 ワンライフ・ナビ</p>
</footer>

</body>
</html>
