<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛犬のよくある質問（FAQ）｜しつけ・食事・健康 - ワンライフ・ナビ</title>
    <meta name="description" content="犬を飼う上で直面する「無駄吠え」「食事」「散歩」などのよくあるお悩みを、AI専門家が分かりやすく回答します。">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "散歩中に他の犬に吠えてしまいます。どうすればいいですか？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "おやつを使って飼い主さんに注目させる『アイコンタクト』の練習が効果的です。吠える前に対処するのがコツです。"
        }
      }, {
        "@type": "Question",
        "name": "ドッグフードを食べない時の対処法は？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "お湯でふやかして香りを立たせるか、トッピングを試してください。ただし、2日以上食べない場合は病気の可能性があります。"
        }
      }]
    }
    </script>
    <style>
        :root { --primary: #f39c12; --secondary: #2c3e50; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.8; max-width: 800px; margin: auto; padding: 20px; background: #fffcf5; color: #333; }
        header { padding: 1rem 0; }
        h1 { border-bottom: 3px solid var(--primary); padding-bottom: 10px; color: var(--secondary); }
        .faq-item { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .q { font-weight: bold; color: #d35400; font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .a { padding-left: 15px; border-left: 3px solid var(--primary); }
        footer { text-align: center; padding: 3rem; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header><a href="index.html" style="text-decoration:none;color:var(--primary);font-weight:bold;">← HOMEへ戻る</a></header>
    <h1>🐾 よくあるご質問（FAQ）</h1>
    <div class="faq-item">
        <span class="q">Q. 散歩中に他の犬に吠えてしまいます。</span>
        <div class="a">A. おやつを使って飼い主さんに注目させる「アイコンタクト」の練習をしましょう。詳細は「しつけ」ページへ。</div>
    </div>
    <div class="faq-item">
        <span class="q">Q. ドッグフードを食べません。</span>
        <div class="a">A. お湯でふやかして香りを立たせるか、トッピングを試してみてください。続く場合は病院へ。</div>
    </div>
    <footer><p>&copy; 2026 ワンライフ・ナビ</p></footer>
</body>
</html>
